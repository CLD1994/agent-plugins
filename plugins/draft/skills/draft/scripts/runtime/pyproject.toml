[project]
name = "draft-runtime"
version = "0.3.0"
description = "Deterministic runtime for recursive discussion drafts."
requires-python = ">=3.12,<3.15"
dependencies = [
    "markdown-it-py>=4.2,<4.3",
    "Send2Trash>=2.1,<2.2",
]

[project.scripts]
draft = "draft.cli:main"

[dependency-groups]
test = [
    "pytest",
    "pytest-mock",
]
dev = [
    { include-group = "test" },
    "hatchling>=1.31,<1.32",
    "pyright",
    "ruff",
]

[build-system]
requires = ["hatchling>=1.31,<1.32"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/draft"]

[tool.uv]
package = true

[tool.pytest.ini_options]
testpaths = ["tests/unit"]
addopts = ["--strict-markers"]
pythonpath = ["."]
markers = [
    "network: 需要外部依赖解析、下载或冷 uv 缓存的集成测试",
]

[tool.pyright]
include = ["src", "tests", "benchmarks"]
pythonVersion = "3.12"
typeCheckingMode = "strict"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
