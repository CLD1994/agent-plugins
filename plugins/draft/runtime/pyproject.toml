[project]
name = "draft-runtime"
version = "0.1.0"
description = "Deterministic runtime for recursive discussion drafts."
requires-python = ">=3.14,<3.15"
dependencies = [
    "markdown-it-py",
    "Send2Trash",
]

[project.scripts]
draft = "draft.cli:main"
draft-hook-claude = "draft.claude_hook:main"

[dependency-groups]
dev = [
    "hatchling",
    "pytest",
    "pyright",
    "ruff",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/draft"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.14"
typeCheckingMode = "strict"

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
